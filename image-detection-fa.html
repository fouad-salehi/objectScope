<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>تشخیص تصویر - آبجکت اسکوپ</title>

        <link rel="stylesheet" href="dashboard/assets/css/stylesheet.css">
        <link rel="stylesheet" href="dashboard/assets/css/detection.css">

        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
        <script src="dashboard/assets/js/engine.js" defer></script>
        <script src="dashboard/assets/js/image-detector.js" defer></script>
    </head>
    <body>
        <header class="navbar">
            <div class="nav-container">
                <a href="indexfa.html" class="brand">
                    <img
                        src="dashboard/assets/images/brandmark.png"
                        alt="آبجکت اسکوپ"
                    >
                    <span>آبجکت اسکوپ</span>
                </a>
                <nav class="nav-menu">
                    <a href="/indexfa">خانه</a>
                    <a href="/indexfa#features">ویژگی‌ها</a>
                    <a href="/image-detection-fa">تشخیص تصویر</a>
                    <a href="/camera-detection-fa">تشخیص دوربین</a>
                    <a href="/indexfa#proposal">پروپوزال</a>
                    <a href="/indexfa#about">درباره</a>
                </nav>
                <button class="menu-toggle" id="menu-toggle">
                    ☰
                </button>
            </div>
        </header>
        <main>
            <section class="detection-section">
                <div class="detection-container">
                    <div class="detection-header">
                        <h1>
                            تشخیص تصویر
                        </h1>
                        <p>
                            یک تصویر را بارگذاری کنید و اجازه دهید هوش مصنوعی با استفاده از COCO-SSD و TensorFlow.js اشیاء موجود در آن را تشخیص دهد.
                        </p>
                    </div>
                    <div class="model-status" id="model-status">
                        در حال بارگذاری مدل هوش مصنوعی...
                    </div>
                    <div class="upload-box">
                        <input
                            type="file"
                            id="image-upload"
                            accept="image/*"
                        >
                        <label for="image-upload">
                            انتخاب تصویر
                        </label>
                    </div>
                    <div class="image-container">
                        <img id="preview-image">
                        <canvas id="detection-canvas"></canvas>
                    </div>
                    <div class="result-box">
                        <h2>
                            نتایج تشخیص
                        </h2>
                        <div id="results">
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="footer-container">
                <p>
                    طراحی و توسعه توسط
                    <a
                        href="https://github.com/theinternetisahellhole"
                        target="_blank"
                    >
                        Fouad Salehi
                    </a>
                </p>
            </div>
        </footer>
    </body>
</html>
