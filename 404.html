<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>404 | Object Scope</title>
      <style>

          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              font-family: 'Inter', sans-serif;
          }

          body {

              min-height: 100vh;

              display: flex;

              align-items: center;

              justify-content: center;

              background: #f8fafc;

              color: #111827;

              padding: 25px;

              overflow: hidden;
          }

          .error-page {

              width: 100%;

              max-width: 850px;

              text-align: center;

              position: relative;
          }

          .error-card {

              background: #ffffff;

              padding: 70px 45px;

              border-radius: 22px;

              box-shadow:
                  0 10px 30px
                  rgba(0, 0, 0, 0.08);

              border: 1px solid
                  rgba(0, 0, 0, 0.04);

              position: relative;

              overflow: hidden;
          }

          .error-card::before {

              content: "";

              position: absolute;

              width: 220px;

              height: 220px;

              border-radius: 50%;

              background:
                  rgba(37, 99, 235, 0.06);

              top: -120px;

              right: -100px;
          }

          .error-card::after {

              content: "";

              position: absolute;

              width: 180px;

              height: 180px;

              border-radius: 50%;

              border: 1px solid
                  rgba(37, 99, 235, 0.08);

              bottom: -100px;

              left: -80px;
          }

          .error-code {

              position: relative;

              z-index: 2;

              font-size: clamp(
                  120px,
                  22vw,
                  200px
              );

              line-height: 0.9;

              font-weight: 800;

              letter-spacing: -10px;

              color: #2563eb;

              text-shadow:
                  0 15px 30px
                  rgba(37, 99, 235, 0.12);

              margin-bottom: 25px;
          }

          .error-card h1 {

              position: relative;

              z-index: 2;

              font-size: 32px;

              font-weight: 700;

              color: #111827;

              margin-bottom: 15px;
          }

          .error-card p {

              position: relative;

              z-index: 2;

              font-size: 16px;

              color: #6b7280;

              line-height: 1.8;
          }

          .error-line {

              width: 60px;

              height: 3px;

              background: #2563eb;

              border-radius: 10px;

              margin: 25px auto 0;

              position: relative;

              z-index: 2;
          }

          @media (max-width: 600px) {

              body {
                  padding: 18px;
              }

              .error-card {

                  padding: 55px 20px;

                  border-radius: 18px;
              }

              .error-code {

                  font-size: 110px;

                  letter-spacing: -6px;
              }

              .error-card h1 {

                  font-size: 25px;
              }

              .error-card p {

                  font-size: 14px;
              }
          }

      </style>
  </head>
  <body>
      <main class="error-page">
          <section class="error-card">
              <div class="error-code">
                  404
              </div>
              <h1>
                  Page Not Found
              </h1>
              <p>
                  The page you are looking for does not exist.
              </p>
              <div class="error-line"></div>
          </section>
      </main>
  </body>
</html>
