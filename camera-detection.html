<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Camera Detection - Object Scope</title>

        <link rel="stylesheet" href="dashboard/assets/css/stylesheet.css">
        <link rel="stylesheet" href="dashboard/assets/css/camera.css">

        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
        <script src="dashboard/assets/js/engine.js" defer></script>
        <script src="dashboard/assets/js/camera-detector.js" defer></script>
    </head>
    <body>
        <header class="navbar">
            <div class="nav-container">
                <a href="index.html" class="brand">
                    <img src="dashboard/assets/images/brandmark.png" alt="Object Scope">
                    <span>
                        Object Scope
                    </span>
                </a>
                <nav class="nav-menu">
                    <a href="/indexen">Home</a>
                    <a href="/indexen#features">Features</a>
                    <a href="/image-detection">Image Detection</a>
                    <a href="/camera-detection">Camera Detection</a>
                    <a href="/indexen#proposal">Proposal</a>
                    <a href="/indexen#about">About</a>
                </nav>
                <button class="menu-toggle" id="menu-toggle">
                    ☰
                </button>
            </div>
        </header>
        <main>
            <section class="camera-section">
                <div class="camera-container">
                    <div class="camera-header">
                        <h1>
                            Camera Detection
                        </h1>
                        <p>
                            Real-time object detection using your camera powered by TensorFlow.js and COCO-SSD.
                        </p>
                    </div>
                    <div class="model-status" id="model-status">
                        Loading AI Model...
                    </div>
                    <div class="camera-box">
                        <video id="camera" autoplay playsinline></video>
                        <canvas id="camera-canvas"></canvas>
                    </div>
                    <div class="camera-controls">
                        <button id="start-camera">
                            Start Camera
                        </button>
                        <button id="stop-camera">
                            Stop Camera
                        </button>
                    </div>
                    <div class="camera-results">
                        <h2>
                            Detection Results
                        </h2>
                        <div id="camera-results">
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="footer-container">
                <p>
                    Designed and Developed by
                    <a href="https://github.com/theinternetisahellhole" target="_blank">
                        Fouad Salehi
                    </a>
                </p>
            </div>
        </footer>
    </body>
</html>
