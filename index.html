<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Object Scope</title>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Inter', sans-serif;
            }

            html,
            body {
                width: 100%;
                height: 100%;
            }

            body {
                background: #ffffff;
                color: #111827;
            }

            .language-page {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 25px;
            }

            .language-container {
                width: 100%;
                max-width: 650px;
                text-align: center;
            }

            .brand {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin-bottom: 45px;
            }

            .brand img {
                width: clamp(120px, 20vw, 180px);
                height: auto;
                object-fit: contain;
                margin-bottom: 20px;
                animation: logoFade 1.2s ease-in-out infinite alternate;
            }

            .brand h1 {
                font-size: clamp(28px, 5vw, 42px);
                font-weight: 700;
                color: #111827;
                margin-bottom: 12px;
            }

            .brand p {
                font-size: 17px;
                color: #6b7280;
                line-height: 1.8;
            }

            .language-title {
                font-size: 22px;
                font-weight: 600;
                color: #111827;
                margin-bottom: 25px;
            }

            .language-options {
                display: flex;
                justify-content: center;
                gap: 20px;
            }

            .language-btn {
                width: 210px;
                padding: 18px 25px;
                border-radius: 14px;
                border: 1px solid rgba(0, 0, 0, 0.08);
                background: #ffffff;
                color: #111827;
                text-decoration: none;
                font-size: 17px;
                font-weight: 600;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                transition: 0.3s;
            }

            .language-btn:hover {
                transform: translateY(-5px);
                border-color: #2563eb;
                color: #2563eb;
                box-shadow: 0 15px 35px rgba(37, 99, 235, 0.12);
            }

            .language-btn span {
                display: block;
                margin-top: 6px;
                font-size: 13px;
                font-weight: 400;
                color: #6b7280;
            }

            .footer {
                position: fixed;
                bottom: 25px;
                left: 0;
                width: 100%;
                text-align: center;
            }

            .footer p {
                color: #9ca3af;
                font-size: 13px;
            }

            @keyframes logoFade {
                from {
                    transform: scale(0.95);
                    opacity: 0.7;
                }

                to {
                    transform: scale(1.05);
                    opacity: 1;
                }
            }

            @media (max-width: 600px) {
                .language-options {
                    flex-direction: column;
                    align-items: center;
                }

                .language-btn {
                    width: 100%;
                    max-width: 300px;
                }

                .brand {
                    margin-bottom: 35px;
                }

                .language-title {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <main class="language-page">
            <div class="language-container">
                <div class="brand">
                    <img
                        src="dashboard/assets/images/brandmark.png"
                        alt="Object Scope"
                    >
                    <h1>Object Scope</h1>
                    <p>
                        لطفاً زبان مورد نظر خود را انتخاب کنید.
                    </p>
                </div>
                <h2 class="language-title">
                    انتخاب زبان
                </h2>
                <div class="language-options">
                    <a href="indexfa" class="language-btn">
                        فارسی
                        <span>ادامه به زبان فارسی</span>
                    </a>
                    <a href="indexen" class="language-btn">
                        English
                        <span>Continue in English</span>
                    </a>
                </div>
            </div>
        </main>
        <footer class="footer">
            <p>
                All Rights Reserved © Object Scope 2026
            </p>
        </footer>
    </body>
</html>
